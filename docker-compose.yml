# Stack do n8n self-hosted. O MESMO arquivo serve prod e dev — o que muda é o
# .env ao lado (renderizado pelo scripts/deploy.sh a partir de envs/<env>.env +
# secrets do Secret Manager).
#
#   prod: COMPOSE_PROFILES=queue  → n8n main + redis + N workers (queue mode)
#   dev:  COMPOSE_PROFILES=       → n8n main sozinho (regular mode)
#
# Caddy fica na frente com HTTPS automático (Let's Encrypt). Só 80/443 saem
# da máquina; n8n, postgres e redis ficam na rede interna do compose.

x-n8n-common: &n8n-common
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?defina N8N_VERSION}
  restart: unless-stopped
  environment: &n8n-env
    # --- URL pública (Caddy termina TLS e repassa para :5678) -------------
    N8N_HOST: ${N8N_HOST:?defina N8N_HOST}
    N8N_PORT: "5678"
    N8N_PROTOCOL: https
    N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
    WEBHOOK_URL: https://${N8N_HOST}/
    N8N_PROXY_HOPS: "1"
    # --- Banco --------------------------------------------------------------
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: "5432"
    DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
    DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    DB_POSTGRESDB_SCHEMA: public
    # --- Segurança ----------------------------------------------------------
    # Perder esta chave = perder TODAS as credenciais salvas. Vive no Secret
    # Manager (n8n-<env>-encryption-key); nunca rotacione sem migrar.
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY}
    N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_JWT_SECRET:?defina N8N_JWT_SECRET}
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    N8N_RUNNERS_ENABLED: "true"
    # --- Execuções ----------------------------------------------------------
    EXECUTIONS_MODE: ${EXECUTIONS_MODE:-regular}
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: "6379"
    QUEUE_HEALTH_CHECK_ACTIVE: "true"
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: ${OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS:-false}
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
    EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-50000}
    EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-all}
    # --- Diversos -----------------------------------------------------------
    GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
    TZ: ${TZ:-America/Sao_Paulo}
    N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
    N8N_LOG_OUTPUT: console
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_VERSION_NOTIFICATIONS_ENABLED: ${N8N_VERSION_NOTIFICATIONS_ENABLED:-true}
    N8N_HIRING_BANNER_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_METRICS: ${N8N_METRICS:-false}
    N8N_DEFAULT_BINARY_DATA_MODE: filesystem
  volumes:
    - n8n_data:/home/node/.n8n
    # Pasta compartilhada para os nós Read/Write Files (/files dentro do n8n).
    - ./local-files:/files
  depends_on:
    postgres:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    container_name: n8n-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      N8N_HOST: ${N8N_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL em envs/<env>.env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    profiles: ["queue"]
    # Fila do Bull não pode sofrer eviction; persiste em disco a cada 60s.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    <<: *n8n-common
    container_name: n8n-main
    # Fica só na rede interna: quem expõe é o Caddy.
    expose:
      - "5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  n8n-worker:
    <<: *n8n-common
    profiles: ["queue"]
    command: worker --concurrency=${N8N_WORKER_CONCURRENCY:-10}
    deploy:
      replicas: ${N8N_WORKER_REPLICAS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  n8n_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
