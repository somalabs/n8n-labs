# Stack do n8n self-hosted. O MESMO arquivo serve prod e dev — o que muda é o
# .env ao lado (renderizado pelo scripts/deploy.sh a partir de envs/<env>.env +
# secrets do Secret Manager).
#
#   prod: COMPOSE_PROFILES=queue  → n8n main + redis + N workers (queue mode)
#   dev:  COMPOSE_PROFILES=       → n8n main sozinho (regular mode)
#
# Banco: Cloud SQL (instância `n8n`, IP privado na soma-network) — nada de
# postgres na VM. O n8n main publica a porta N8N_PUBLISH_PORT (80) direto no
# host; o DNS interno (n8n-<env>.somalabs.com.br) aponta para o IP interno da
# VM e só quem está na VPN chega até aqui. Redis fica só na rede do compose.

x-n8n-common: &n8n-common
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?defina N8N_VERSION}
  restart: unless-stopped
  environment: &n8n-env
    # --- URL pública (HTTP puro, sem proxy na frente) ------------------------
    N8N_HOST: ${N8N_HOST:?defina N8N_HOST}
    N8N_PORT: "5678"
    N8N_PROTOCOL: http
    N8N_EDITOR_BASE_URL: http://${N8N_HOST}/
    WEBHOOK_URL: http://${N8N_HOST}/
    # Sem TLS o navegador não aceita cookie `Secure`; sem isto o login não passa.
    N8N_SECURE_COOKIE: "false"
    # --- Banco (Cloud SQL) --------------------------------------------------
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: ${POSTGRES_HOST:?defina POSTGRES_HOST (IP privado do Cloud SQL)}
    DB_POSTGRESDB_PORT: ${POSTGRES_PORT:-5432}
    DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?defina POSTGRES_DB}
    DB_POSTGRESDB_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    DB_POSTGRESDB_SCHEMA: public
    # A instância exige TLS (sslMode ENCRYPTED_ONLY). O certificado do Cloud SQL
    # é emitido para o connection name, não para o IP, então a verificação de
    # hostname falharia — daí REJECT_UNAUTHORIZED=false. O tráfego continua
    # cifrado e nunca sai da VPC.
    DB_POSTGRESDB_SSL_ENABLED: "true"
    DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
    # --- Segurança ----------------------------------------------------------
    # Perder esta chave = perder TODAS as credenciais salvas. Vive no Secret
    # Manager (n8n-<env>-encryption-key); nunca rotacione sem migrar.
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY}
    N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_JWT_SECRET:?defina N8N_JWT_SECRET}
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    N8N_RUNNERS_ENABLED: "true"
    # --- Execuções ----------------------------------------------------------
    EXECUTIONS_MODE: ${EXECUTIONS_MODE:-regular}
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: "6379"
    QUEUE_HEALTH_CHECK_ACTIVE: "true"
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: ${OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS:-false}
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
    EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-50000}
    EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-all}
    # --- Diversos -----------------------------------------------------------
    GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
    TZ: ${TZ:-America/Sao_Paulo}
    N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
    N8N_LOG_OUTPUT: console
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_VERSION_NOTIFICATIONS_ENABLED: ${N8N_VERSION_NOTIFICATIONS_ENABLED:-true}
    N8N_HIRING_BANNER_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_METRICS: ${N8N_METRICS:-false}
    N8N_DEFAULT_BINARY_DATA_MODE: filesystem
  volumes:
    - n8n_data:/home/node/.n8n
    # Pasta compartilhada para os nós Read/Write Files (/files dentro do n8n).
    - ./local-files:/files

services:
  redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    profiles: ["queue"]
    # Fila do Bull não pode sofrer eviction; persiste em disco a cada 60s.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    <<: *n8n-common
    container_name: n8n-main
    # Publica direto no host: http://<N8N_HOST>:<N8N_PUBLISH_PORT>/ → n8n:5678.
    # Com N8N_PUBLISH_PORT=80 a URL fica sem porta (http://n8n-dev.somalabs.com.br/).
    ports:
      - "${N8N_PUBLISH_PORT:-80}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  n8n-worker:
    <<: *n8n-common
    profiles: ["queue"]
    command: worker --concurrency=${N8N_WORKER_CONCURRENCY:-10}
    deploy:
      replicas: ${N8N_WORKER_REPLICAS:-2}
    depends_on:
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  n8n_data:
  redis_data:
